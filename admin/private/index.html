<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABCQR Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }
      body {
        background: #0b0f17;
        color: #fff;
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: #101522;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        border-right: 1px solid #1f2636;
      }
      .brand {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 24px;
      }
      .nav button {
        background: transparent;
        border: 1px solid transparent;
        color: #fff;
        padding: 12px 14px;
        text-align: left;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
      }
      .nav button.active {
        background: #1a2234;
        border-color: #2a3550;
      }
      .logout {
        margin-top: auto;
        background: #ef4444;
        border: none;
        padding: 12px 14px;
        border-radius: 12px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .content {
        padding: 32px 40px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .header h2 {
        font-size: 24px;
      }
      .panel {
        background: #121826;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 32px;
        border: 1px solid #1f2636;
      }
      .panel h3 {
        margin-bottom: 16px;
        font-size: 18px;
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      form label {
        display: block;
        font-size: 12px;
        color: #9ca3af;
        margin-bottom: 6px;
      }
      form input,
      form select,
      form textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #2b3448;
        background: #0c111c;
        color: #fff;
      }
      form textarea {
        min-height: 80px;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }
      .btn {
        padding: 10px 16px;
        border-radius: 10px;
        border: none;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.secondary {
        background: #374151;
      }
      .btn.danger {
        background: #ef4444;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #1f2636;
      }
      th {
        text-align: left;
        color: #9ca3af;
        font-weight: 500;
      }
      .row-actions {
        display: flex;
        gap: 10px;
      }
      .icon-btn {
        background: transparent;
        border: none;
        cursor: pointer;
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        fill: #fff;
      }
      .hidden {
        display: none;
      }
      .images-preview {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .images-preview img {
        width: 60px;
        height: 60px;
        border-radius: 10px;
        object-fit: cover;
        border: 1px solid #1f2636;
      }
      .toast {
        position: fixed;
        top: 24px;
        right: 24px;
        background: #1f2937;
        padding: 12px 16px;
        border-radius: 10px;
        color: #fff;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 999;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">ABCQR Admin</div>
      <div class="nav">
        <button class="active" data-section="products">Productos</button>
        <button data-section="users">Usuarios</button>
        <button data-section="businesses">Negocios</button>
      </div>
      <button class="logout" id="logout">Cerrar sesión</button>
    </aside>
    <main class="content">
      <div class="header">
        <h2 id="section-title">Productos</h2>
      </div>

      <section id="products" class="section active">
        <div class="panel">
          <h3>Gestión de Productos</h3>
          <form id="product-form">
            <div>
              <label>Título <span>(texto obligatorio)</span></label>
              <input type="text" name="title" required />
            </div>
            <div>
              <label>Precio <span>(ej. 120.50)</span></label>
              <input type="number" name="prec" step="0.01" required />
            </div>
            <div>
              <label>Activo <span>(true/false)</span></label>
              <select name="active">
                <option value="true">Activo</option>
                <option value="false">Inactivo</option>
              </select>
            </div>
            <div>
              <label>Negocio <span>(selecciona el negocio)</span></label>
              <select name="business_id" id="product-business"></select>
            </div>
            <div>
              <label>Descripción <span>(opcional)</span></label>
              <textarea name="description"></textarea>
            </div>
            <div>
              <label>Imágenes <span>(hasta 4 archivos)</span></label>
              <input type="file" name="images" id="product-images" multiple accept="image/*" />
            </div>
            <div class="images-preview" id="product-preview"></div>
            <input type="hidden" name="id" />
            <input type="hidden" name="img1" />
            <input type="hidden" name="img2" />
            <input type="hidden" name="img3" />
            <input type="hidden" name="img4" />
          </form>
          <div class="actions">
            <button class="btn" id="product-save">Guardar</button>
            <button class="btn secondary" id="product-clear">Limpiar</button>
            <button class="btn danger" id="product-delete-selected">Eliminar seleccionados</button>
          </div>
          <table>
            <thead>
              <tr>
                <th><input type="checkbox" id="product-select-all" /></th>
                <th>ID</th>
                <th>Título</th>
                <th>Precio</th>
                <th>Activo</th>
                <th>Negocio</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="product-table"></tbody>
          </table>
        </div>
      </section>

      <section id="users" class="section">
        <div class="panel">
          <h3>Gestión de Usuarios</h3>
          <form id="user-form">
            <div>
              <label>Usuario <span>(nombre único)</span></label>
              <input type="text" name="username" required />
            </div>
            <div>
              <label>Contraseña <span>(texto obligatorio)</span></label>
              <input type="password" name="password" required />
            </div>
            <div>
              <label>Negocio <span>(asignación)</span></label>
              <select name="business_id" id="user-business"></select>
            </div>
            <input type="hidden" name="id" />
          </form>
          <div class="actions">
            <button class="btn" id="user-save">Guardar</button>
            <button class="btn secondary" id="user-clear">Limpiar</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Negocio</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="user-table"></tbody>
          </table>
        </div>
      </section>

      <section id="businesses" class="section">
        <div class="panel">
          <h3>Gestión de Negocios</h3>
          <form id="business-form">
            <div>
              <label>Nombre <span>(texto obligatorio)</span></label>
              <input type="text" name="name" required />
            </div>
            <input type="hidden" name="id" />
          </form>
          <div class="actions">
            <button class="btn" id="business-save">Guardar</button>
            <button class="btn secondary" id="business-clear">Limpiar</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="business-table"></tbody>
          </table>
        </div>
      </section>
    </main>
    <div id="toast" class="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/admin/private/script.js"></script>
  </body>
</html>
