<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABCQR Admin - Login</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", "Segoe UI", sans-serif;
      }
      body {
        background: #0e1117;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-card {
        background: #151a23;
        padding: 48px;
        border-radius: 16px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 24px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #a6adbb;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #2a3242;
        background: #0e1117;
        color: #fff;
        margin-bottom: 16px;
      }
      button {
        width: 100%;
        padding: 12px 14px;
        border: none;
        border-radius: 10px;
        background: #3b82f6;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        margin-top: 12px;
        color: #f87171;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Panel ABCQR</h1>
      <form id="login-form">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" placeholder="abc" required />
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="••••" required />
        <button type="submit">Ingresar</button>
      </form>
      <div id="error" class="error"></div>
    </div>
    <script>
      const form = document.getElementById("login-form");
      const error = document.getElementById("error");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        const payload = {
          username: form.username.value.trim(),
          password: form.password.value,
        };
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          error.textContent = "Credenciales inválidas";
          return;
        }
        window.location.href = "/admin/private";
      });
    </script>
  </body>
</html>
